name: build-kwin-arm64

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "运行器（arm64 原生最快；x86 会用 qemu 模拟，慢 5–10×）"
        required: true
        default: ubuntu-24.04-arm
        type: choice
        options:
          - ubuntu-24.04-arm
          - ubuntu-latest
  push:
    branches: [ main ]
    paths:
      - "patches/**"
      - "overlay/**"
      - "scripts/**"
      - "Dockerfile"
      - ".github/workflows/**"

env:
  IMAGE: kwin-anland-builder
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    # arm64 托管 runner 对公共仓库免费；私有仓库若不可用，用 workflow_dispatch 选 ubuntu-latest 走 qemu
    runs-on: ${{ inputs.runner || 'ubuntu-24.04-arm' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Show runner arch
        run: uname -m; nproc; free -h

      - name: Install qemu binfmt (x86 runner only)
        if: inputs.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Build docker image
        run: docker build -t "$IMAGE" .

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ccache
          key: ccache-${{ github.run_id }}
          restore-keys: |
            ccache-

      - name: Compile
        run: |
          mkdir -p ccache out
          docker run --rm \
            -v "$PWD":/work \
            -v "$PWD/ccache":/ccache \
            -e CCACHE_DIR=/ccache \
            -e JOBS=$(nproc) \
            "$IMAGE" \
            bash /work/scripts/build.sh

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ccache
          key: ccache-${{ github.run_id }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kwin-anland-arm64
          path: |
            out/libkwin.so.6.3.6
            out/kwin_wayland
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
